<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #f0f2f5, #dce3ea);
    margin: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 40px 20px;
    color: #333;
}

.weatherForm {
    margin: 20px;
    display: flex;
    gap: 15px;
}

.cityInput {
    padding: 12px 16px;
    font-size: 1.2rem;
    border: 1px solid #ccc;
    border-radius: 8px;
    width: 280px;
    transition: all 0.3s ease;
}

.cityInput:focus {
    outline: none;
    border-color: #4a90e2;
    box-shadow: 0 0 8px rgba(74, 144, 226, 0.4);
}

button[type="submit"] {
    padding: 12px 24px;
    font-size: 1.1rem;
    font-weight: 600;
    background: #4a90e2;
    color: #fff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.3s ease, transform 0.2s ease;
}

button[type="submit"]:hover {
    background: #357abd;
    transform: translateY(-2px);
}

button[type="submit"]:active {
    transform: translateY(0);
}
.card{
            background: linear-gradient(180deg, hsl(216, 89%, 75%), hsl(39, 100%, 75%));
            padding: 50px;
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.422);
            min-width: 300px;
            display: flex;
            border-radius: 10px;
            flex-direction: column;
            align-items: center;
        }
        h1{
            margin-top: 0;
            margin-bottom: 25px;
        }
        p{
            font-size: 1.5rem;
            margin: 5px 0;
        }
        .cityDisplay, .tempDisplay{
            font-size: 3.5rem;
            font-weight: bold;
            color: hsla(0, 0%, 0%, 0.765);
            margin-bottom: 25px;
        }
        .humidityDisplay{
            font-weight: bold;
            margin-bottom: 25px;
        }
        .descDisplay{
            font-style: italic;
            font-weight: bold;
            font-size: 2rem;
        }
        .weatherEmoji{
            margin: 0;
            font-size: 7.5rem;
        }
        .errorDisplay{
            font-size: 2.5rem;
            font-weight: bold;
            color: hsla(0, 0%, 0%, 0.747);
        }

    </style>
</head>
<body>
    <form class="weatherForm">
        <input type="text" class="cityInput" placeholder="Enter city">
        <button type="submit">Get Weather</button>
    </form>

    <div class="card" style="display:none"></div>

    <script>
        const weatherForm = document.querySelector(".weatherForm");
        const cityInput = document.querySelector(".cityInput");
        const card = document.querySelector(".card");
        const apiKey = "3a3b2288e2fc878b760d2e0a89fc1dc7";

        weatherForm.addEventListener("submit", async event => {
            event.preventDefault();

            const city = cityInput.value;

            if(city){
                try{
                    const weatherData = await getWeatherData(city);
                    displayWeatherInfo(weatherData);

                }
                catch(error){
                    console.error(error);
                    displayError(error);
                }

            }
            else{
                displayError("Please enter a city");
            }
        });

        async function getWeatherData(city) {
            const apiUrl = `https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${apiKey}`;
            const response = await fetch(apiUrl);
            
            if(!response.ok) {
                throw new Error("Could not fetch weather data");
            }
            return await response.json();
        }

        function displayWeatherInfo(data) {
            const { name: city, 
                    main: {temp,humidity}, 
                    weather: [{description, id}]} = data;

                    card.textContent = "";
                    card.style.display = "flex";

                    const cityDisplay = document.createElement("h1");
                    const tempDisplay = document.createElement("p");
                    const humidityDisplay = document.createElement("p");
                    const descDisplay = document.createElement("p");
                    const weatherEmoji = document.createElement("p");

                    cityDisplay.textContent = city;
                    tempDisplay.textContent = `${(temp - 273.15).toFixed(1)}°C`;
                    humidityDisplay.textContent = `Humidity: ${humidity}%`;
                    descDisplay.textContent = description;
                    weatherEmoji.textContent = getWeatherEmoji(id);

                    cityDisplay.classList.add("cityDisplay");
                    tempDisplay.classList.add("tempDisplay");
                    humidityDisplay.classList.add("humidityDisplay");
                    descDisplay.classList.add("descDisplay");
                    weatherEmoji.classList.add("weatherEmoji");

                    card.appendChild(cityDisplay);
                    card.appendChild(tempDisplay);
                    card.appendChild(humidityDisplay);
                    card.appendChild(descDisplay);
                    card.appendChild(weatherEmoji);

        }
        function getWeatherEmoji(weatherId) {
            switch(true){
                case (weatherId >= 200 && weatherId < 300): return "⛈️";
                case (weatherId >= 300 && weatherId < 400): return "🌦️";
                case (weatherId >= 500 && weatherId < 600): return "🌧️";
                case (weatherId >= 600 && weatherId < 700): return "🌨️";
                case (weatherId >= 700 && weatherId < 800): return "🌫️";
                case (weatherId === 800): return "☀️";
                case (weatherId >= 801 && weatherId < 810): return "☁️";
                default: return "❓";
                
            }

        }
        function displayError(message) {
            const errorDisplay = document.createElement("p");
            errorDisplay.textContent = message;
            errorDisplay.classList.add("errorDisplay");

            card.textContent = "";
            card.style.display = "flex";
            card.appendChild(errorDisplay);
        }
    </script>
</body>
</html>
